<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<title>QRISPay — Admin</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/app.css?v=17">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="/assets/logo.svg" alt="QRISPay">
      <div><h1>QRISPay</h1><p class="brand-sub">Payment Gateway</p></div>
    </div>
    <div class="badge">Admin Panel</div>
    <nav>
      <div class="nav-group-label">Manajemen</div>
      <a href="#overview" class="nav" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
      <a href="#users" class="nav" data-view="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6M18 20a6.6 6.6 0 0 0-2-4.7"/></svg>Pengguna</a>
      <a href="#plans" class="nav" data-view="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h6"/></svg>Paket</a>
      <a href="#providers" class="nav" data-view="providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M14 3h3a1 1 0 0 1 1 1v3M3 14v-3a1 1 0 0 1 1-1h3"/></svg>Provider</a>
      <div class="nav-group-label">Transaksi</div>
      <a href="#orders" class="nav" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14l-1.5 16.5h-11z"/><path d="M9 8v9M15 8l-1 9"/></svg>Order</a>
      <a href="#qris" class="nav" data-view="qris"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M14 3h3a1 1 0 0 1 1 1v3M3 14v-3a1 1 0 0 1 1-1h3"/></svg>Invoice</a>
      <a href="#withdrawals" class="nav" data-view="withdrawals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>Withdraw</a>
      <a href="#unmatched" class="nav" data-view="unmatched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>Unmatched</a>
      <a href="#holds" class="nav" data-view="holds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hold H+1</a>
      <a href="#logs" class="nav" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h11l4 4v14H5z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>Logs</a>
      <div class="nav-group-label">Bantuan</div>
      <a href="/app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>User</a>
      <a href="/docs" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h7M8 12h7"/></svg>Docs</a>
      <a href="#" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>Keluar</a>
    </nav>
  </aside>
  <main class="main">
    <div class="main-inner">
      <div class="topbar">
        <img class="topbar-logo" src="/assets/logo.svg" alt="">
        <h2 id="view-title">Overview</h2>
        <div class="user" id="whoami"></div>
      </div>
      <div id="content"></div>
    </div>
  </main>
</div>
<script src="/assets/common.js?v=17"></script>
<script>
// Global error trap: tampilkan error JS langsung di layar supaya bisa dilihat user
window.addEventListener('error', (e) => {
  const c = document.getElementById('content');
  if (c) c.innerHTML = `<div class="panel"><h3>Terjadi Error</h3><p class="msg err">${esc(e.message)}</p><p class="hint">File: ${esc(e.filename)}:${e.lineno}:${e.colno}</p><button class="btn sec" onclick="location.reload()">Muat ulang</button></div>`;
});
const content = document.getElementById('content');
const title = document.getElementById('view-title');
const TITLES = { overview:'Overview', users:'Pengguna', plans:'Paket Langganan', providers:'Provider & OTP', orders:'Order', qris:'Invoice', withdrawals:'Withdraw', unmatched:'Unmatched', holds:'Hold H+1', logs:'Logs' };

document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await api('/app/api/auth/logout', { method: 'POST' }); location.href = '/'; };
document.querySelectorAll('.nav').forEach(a => a.onclick = (e) => { e.preventDefault(); const v = a.dataset.view; location.hash = v; render(v); });

function renderError(msg) {
  content.innerHTML = `<div class="panel"><h3>Gagal memuat</h3><p class="msg err">${esc(msg || 'Terjadi kesalahan')}</p><button class="btn sec" onclick="location.reload()">Muat ulang</button></div>`;
}

async function render(view) {
  title.textContent = TITLES[view] || view;
  setActiveNav(view);
  showSkeleton(content);
  let ov;
  try {
    ov = await loadAdminOverview();
  } catch (e) {
    renderError(e.message);
    return;
  }
  if (!ov) return; // bounced to /login
  document.getElementById('whoami').innerHTML = `<span class="dot"></span> ${esc(ov.user?.email || 'admin')}`;
  content.innerHTML = `<p class="muted">Memuat ${TITLES[view] || view}…</p>`;
  const fn = ({ overview: renderOverview, users: renderUsers, plans: renderPlans, providers: renderProviders, orders: renderOrders, qris: renderQris, withdrawals: renderWithdrawals, unmatched: renderUnmatched, holds: renderHolds, logs: renderLogs })[view];
  if (!fn) { content.innerHTML = `<p class="muted">Menu tidak dikenal: ${esc(view)}</p>`; return; }
  try { fn(ov); } catch (e) { renderError(e.message); }
}

async function admin(path, opts) { const r = await api('/admin/api' + path, opts); return r; }

function renderOverview(d) {
  const c = d.counts, rev = d.revenue_30d, provs = (d.providers||[]).map(p => `<div class="card"><div class="lbl">${esc(p.name)}</div><div class="val" style="font-size:14px">${p.implemented ? esc(p.summary?.status||'active') : 'segera'}</div><div class="sub">${esc(p.summary?.merchant_id||'-')}${p.summary?.outlet_name?' · '+esc(p.summary.outlet_name):''}</div></div>`).join('');
  content.innerHTML = `
    <div class="grid">
      <div class="card"><div class="lbl">Pengguna</div><div class="val">${c.users}</div><div class="sub">${c.blocked} diblokir</div></div>
      <div class="card"><div class="lbl">Langganan Aktif</div><div class="val">${c.active_subs}</div><div class="sub">subscriber</div></div>
      <div class="card"><div class="lbl">API Keys Aktif</div><div class="val">${c.api_keys}</div></div>
      <div class="card"><div class="lbl">Invoice Pending</div><div class="val">${c.pending_invoices}</div></div>
      <div class="card"><div class="lbl">Withdraw Menunggu</div><div class="val">${c.pending_withdrawals}</div></div>
      <div class="card accent"><div class="lbl">Pendapatan 30d</div><div class="val">${money(rev.total)}</div><div class="sub">${rev.orders} order</div></div>
    </div>
    <div class="panel"><h3>Provider</h3><div class="grid">${provs}</div></div>
    <div class="panel"><h3>Withdraw Menunggu Proses</h3>${(d.pending_withdrawals||[]).length ? `<div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Nominal</th><th>Bank</th><th></th></tr></thead><tbody>${(d.pending_withdrawals||[]).map(w => `<tr><td class="mono">${esc(w.id)}</td><td>${esc(w.user_email)}</td><td>${money(w.amount)}</td><td>${esc(w.bank_detail?.bank_name)} ${esc(w.bank_detail?.account_number)}</td><td><button class="btn sec sm" data-proc="${esc(w.id)}">Proses</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Tidak ada</p>'}</div>
    <div class="panel"><h3>Order Terbaru</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Paket</th><th>Nominal</th><th>Status</th></tr></thead><tbody>${(d.recent_orders||[]).map(o => `<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.plan_name)}</td><td>${money(o.amount)}</td><td>${tag(o.status)}</td></tr>`).join('')}</tbody></table></div></div>
  `;
  document.querySelectorAll('[data-proc]').forEach(b => b.onclick = async () => { const r = await admin('/withdrawals/' + b.dataset.proc + '/process', { method: 'POST' }); if (r.success) { toast('Withdraw diproses', 'ok'); render('overview'); } else toast(r.message || 'Gagal', 'err'); });
}

function renderUsers() {
  content.innerHTML = `
    <div class="panel">
      <form id="su" class="form row"><input name="q" placeholder="Cari email / nama…"><button class="btn" type="submit">Cari</button></form>
    </div>
    <div class="panel"><div id="ul"></div></div>
    <div class="panel" id="ud" style="display:none"></div>
  `;
  document.getElementById('su').addEventListener('submit', e => { e.preventDefault(); loadUsers(new FormData(e.target).get('q')); });
  async function loadUsers(q) {
    const r = await admin('/users' + (q ? '?q=' + encodeURIComponent(q) : ''));
    document.getElementById('ul').innerHTML = `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Email</th><th>Nama</th><th>Saldo</th><th>Langganan</th><th>Status</th><th></th></tr></thead><tbody>${(r.data||[]).map(u => `<tr><td>${u.id}</td><td><a href="#" data-uid="${u.id}">${esc(u.email)}</a></td><td>${esc(u.name||'')}</td><td>${money(u.balance)}<br><span class="muted">held ${money(u.held)}</span></td><td>${u.subscription_active ? tag('active') : tag('EXPIRED')}</td><td>${tag(u.status)}</td><td>${u.status==='active'?`<button class="btn danger sm" data-blk="${u.id}">Blokir</button>`:`<button class="btn sec sm" data-blk="${u.id}">Buka</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-uid]').forEach(a => a.onclick = e => { e.preventDefault(); loadUser(a.dataset.uid); });
    document.querySelectorAll('[data-blk]').forEach(b => b.onclick = async () => { const tgt = (await admin('/users')).data.find(x=>x.id==b.dataset.blk); const status = tgt.status==='active'?'blocked':'active'; await admin('/users/' + b.dataset.blk + '/status', { method: 'POST', body: JSON.stringify({ status }) }); toast('Status user diperbarui', 'ok'); loadUsers(); });
  }
  async function loadUser(id) {
    const r = await admin('/users/' + id); const d = r.data; if (!d) return;
    document.getElementById('ud').style.display = '';
    document.getElementById('ud').innerHTML = `
      <h3>${esc(d.user.email)} <span class="muted">· ${d.user.role}</span></h3>
      <div class="grid">
        <div class="card"><div class="lbl">Saldo</div><div class="val">${money(d.balance.balance)}</div><div class="sub">held ${money(d.balance.held)}</div></div>
        <div class="card"><div class="lbl">Langganan</div><div class="val" style="font-size:14px">${esc(d.subscription.plan||'-')}</div><div class="sub">${d.subscription.active?'Aktif':'Tidak'}</div></div>
      </div>
      <div class="panel"><h4>Beri Langganan Manual</h4><form id="gr" class="form row"><input name="days" type="number" min="1" max="3650" placeholder="hari (1–3650)" required><select name="plan_id"><option value="">tanpa paket</option></select><input name="note" placeholder="catatan"><button class="btn" type="submit">Beri</button></form></div>
      <div class="panel"><h4>Reset Password</h4><form id="pw" class="form row"><input name="password" type="password" placeholder="password baru (min 8)" required><button class="btn sec" type="submit">Reset</button></form></div>
      <div class="panel"><h4>API Keys</h4><div class="table-wrap"><table><tr><th>Prefix</th><th>Label</th><th>Status</th></tr>${(d.api_keys||[]).map(k=>`<tr><td><code>${esc(k.key_prefix)}</code></td><td>${esc(k.label||'')}</td><td>${tag(k.active?'active':'blocked')}</td></tr>`).join('')}</table></div></div>
      <div class="panel"><h4>Invoice Terbaru</h4><div class="table-wrap"><table><tr><th>ID</th><th>Provider</th><th>Total</th><th>Status</th></tr>${(d.recent_invoices||[]).map(i=>`<tr><td class="mono">${esc(i.qris_id||i.id)}</td><td>${esc(i.provider)}</td><td>${money(i.total_amount||i.amount)}</td><td>${tag(i.status)}</td></tr>`).join('')}</table></div></div>
      <div class="panel"><h4>Ledger</h4><div class="table-wrap"><table><tr><th>Waktu</th><th>Tipe</th><th>Nominal</th><th>Saldo</th></tr>${(d.ledger||[]).map(e=>`<tr><td class="muted">${new Date(e.created_at+'Z').toLocaleString('id-ID')}</td><td>${esc(e.type)}</td><td>${money(e.amount)}</td><td>${money(e.balance_after)}</td></tr>`).join('')}</table></div></div>
    `;
    const grSel = document.querySelector('#gr select[name="plan_id"]');
    if (grSel) { try { const plans = (await admin('/plans')).data || []; grSel.innerHTML = '<option value="">tanpa paket</option>' + plans.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(p.tier)}, ${(p.providers||[]).join('/')})</option>`).join(''); } catch {} }
    document.getElementById('gr').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const rr = await admin('/users/'+id+'/subscription', { method:'POST', body: JSON.stringify({ days: Number(f.days), plan_id: f.plan_id || undefined, note: f.note }) }); if (rr.success) toast('Langganan diberikan', 'ok'); else toast(rr.message||'Gagal', 'err'); loadUser(id); };
    document.getElementById('pw').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const rr = await admin('/users/'+id+'/password', { method:'POST', body: JSON.stringify({ password: f.password }) }); if (rr.success) toast('Password direset', 'ok'); else toast(rr.message||'Gagal', 'err'); };
  }
  loadUsers();
}

function renderPlans() {
  (async () => {
    const r = await admin('/plans');
    content.innerHTML = `
      <div class="panel"><h3 id="pf-title">Paket Baru</h3>
        <form id="np" class="form">
          <input type="hidden" name="id">
          <div class="row"><label>Nama<input name="name" required></label><label>Harga<input name="price" type="number" min="0" required></label></div>
          <div class="row"><label>Durasi (hari)<input name="duration_days" type="number" min="1" required></label>
            <label>Settlement<select name="tier"><option value="H1">H+1 (QRIS)</option><option value="H0">H+0 (QRIS Realtime)</option></select></label></div>
          <label>Metode pembayaran (pisah koma — gopay,shopeepay)<input name="providers" placeholder="gopay,shopeepay" required></label>
          <label>Deskripsi<input name="description"></label>
          <label class="switch"><input type="checkbox" name="active" checked> Aktif (bisa dibeli user)</label>
          <div class="row"><button class="btn" type="submit">Simpan</button><button type="button" class="btn sec" id="pf-cancel" hidden>Batal</button></div>
        </form><p id="np-msg" class="msg"></p>
      </div>
      <div class="panel"><h3>Daftar Paket</h3><table><thead><tr><th>ID</th><th>Nama</th><th>Settlement</th><th>Metode</th><th>Harga</th><th>Durasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="pl"></tbody></table></div>
    `;
    const prov = (p) => (p.providers||[]).map(x => x === 'gopay' ? 'QRIS Realtime' : x === 'shopeepay' ? 'QRIS' : esc(x)).join(' + ');
    function fill(rows) {
      document.getElementById('pl').innerHTML = rows.map(p => `<tr>
        <td>${p.id}</td><td>${esc(p.name)} ${(p.providers||[]).includes('gopay') ? '<span class="badge">Prioritas</span>' : ''}</td>
        <td>${esc(p.tier === 'H0' ? 'H+0' : 'H+1')}</td><td>${prov(p)}</td><td>${money(p.price)}</td><td>${p.duration_days}h</td>
        <td>${tag(p.active ? 'active' : 'EXPIRED')}</td>
        <td style="white-space:nowrap">
          <button class="btn sec sm" data-edit="${p.id}">Edit</button>
          <button class="btn sec sm" data-tgl="${p.id}" title="${p.active ? 'Nonaktifkan' : 'Aktifkan'}">${p.active ? 'Nonaktifkan' : 'Aktifkan'}</button>
          <button class="btn danger sm" data-del="${p.id}">Hapus</button>
        </td></tr>`).join('');
      document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(Number(b.dataset.edit), rows));
      document.querySelectorAll('[data-tgl]').forEach(b => b.onclick = async () => {
        const row = rows.find(x => x.id === Number(b.dataset.tgl));
        const rr = await admin('/plans/' + row.id, { method: 'PUT', body: JSON.stringify({ ...row, active: !row.active }) });
        if (rr.success) { toast('Status paket diubah', 'ok'); fill((await admin('/plans')).data); } else toast(rr.message || 'Gagal', 'err');
      });
      document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        if (!confirm('Hapus paket ini? Langganan aktif yang sudah ada tidak terpengaruh.')) return;
        const rr = await admin('/plans/' + b.dataset.del, { method: 'DELETE' });
        if (rr.success) { toast('Paket dihapus', 'ok'); fill((await admin('/plans')).data); } else toast(rr.message || 'Gagal', 'err');
      });
    }
    const form = document.getElementById('np');
    function startEdit(id, rows) {
      const p = rows.find(x => x.id === id); if (!p) return;
      form.id.value = p.id; form.name.value = p.name; form.price.value = p.price;
      form.duration_days.value = p.duration_days; form.tier.value = p.tier || 'H1';
      form.providers.value = (p.providers || []).join(','); form.active.checked = !!p.active;
      document.getElementById('pf-title').textContent = 'Edit Paket #' + p.id;
      document.getElementById('pf-cancel').hidden = false;
      form.name.focus();
    }
    document.getElementById('pf-cancel').onclick = () => { form.reset(); form.id.value = ''; document.getElementById('pf-title').textContent = 'Paket Baru'; document.getElementById('pf-cancel').hidden = true; };
    fill(r.data||[]);
    form.onsubmit = async e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(form));
      const body = { ...f, id: f.id || undefined, price: Number(f.price), duration_days: Number(f.duration_days), providers: String(f.providers).split(',').map(s=>s.trim()).filter(Boolean), active: !!f.active };
      const method = body.id ? 'PUT' : 'POST';
      const url = body.id ? '/plans/' + body.id : '/plans';
      const rr = await admin(url, { method, body: JSON.stringify(body) });
      const msg = document.getElementById('np-msg');
      if (rr.success) { toast('Paket tersimpan', 'ok'); form.reset(); form.id.value=''; document.getElementById('pf-title').textContent='Paket Baru'; document.getElementById('pf-cancel').hidden = true; fill((await admin('/plans')).data); }
      else { msg.textContent = rr.message || 'Gagal'; msg.className = 'msg err'; }
    };
  })();
}

function renderProviders() {
  (async () => {
    const r = await admin('/providers');
    content.innerHTML = `<div id="pv"></div>`;
    const rows = r.data||[];
    document.getElementById('pv').innerHTML = rows.map(p => `
      <div class="panel">
        <h3>${esc(p.name)} ${tag(p.health?.state === 'down' ? 'DOWN' : (p.connected ? 'UP' : 'unconfigured'))}</h3>
        ${p.health?.state === 'down' ? `<p class="msg err">⚠ Gangguan${p.health.reason ? ' — ' + esc(p.health.reason) : ''}${p.health.downSince ? ' sejak ' + new Date(p.health.downSince).toLocaleString('id-ID') : ''}</p>` : ''}
        <div class="row" style="margin:8px 0">
          <button class="btn sm" data-health="${esc(p.name)}" data-state="down">Tandai Gangguan</button>
          <button class="btn sm" data-health="${esc(p.name)}" data-state="up">Tandai Sembuh</button>
          <button class="btn sm" data-health="${esc(p.name)}" data-state="auto">Auto</button>
        </div>
        <div class="grid">
          <div class="card"><div class="lbl">Merchant</div><div class="val" style="font-size:14px">${esc(p.summary?.merchant_id || '-')}</div></div>
          <div class="card"><div class="lbl">Outlet</div><div class="val" style="font-size:14px">${esc(p.summary?.outlet_name || '-')}</div></div>
          <div class="card"><div class="lbl">Telepon</div><div class="val" style="font-size:14px">${esc(p.summary?.phone_number || '-')}</div></div>
        </div>
        <div class="panel">
          <h4>QRIS Statis</h4>
          <form id="sq-${esc(p.name)}" class="form row">
            <input name="qris_static" placeholder="000201010212..." value="${esc(p.summary?.qris_configured ? '****terpasang' : '')}">
            <button class="btn" type="submit">Pasang</button>
          </form>
          <p class="hint">Tempel QRIS statis dari akun operator ${esc(p.name)} (yang diterima pembayaran). Format EMVCo 000201….</p>
        </div>
        ${p.implemented ? `
        <div class="panel">
          <h4>Login OTP (${esc(p.name)})</h4>
          ${p.name === 'shopeepay' ? `
          <details ${p.summary?.device_report ? '' : 'open'}>
            <summary>Sidik Jari Perangkat (wajib sekali)</summary>
            <p class="msg ${p.summary?.device_report ? 'ok' : 'err'}">${p.summary?.device_report ? '✓ Terpasang (' + p.summary.device_report + ')' : 'Belum terpasang — OTP tidak akan terkirim tanpa ini'}</p>
            <form id="dr-${esc(p.name)}" class="form">
              <div class="row"><label>Device-risk blob <textarea name="blob" rows="3" placeholder="POST .../v2/shpsec/web/report request payload (string panjang)"></textarea></label></div>
              <button class="btn sm" type="submit">Pasang Blob</button>
            </form>
            <p class="msg">Cara ambil di PC: buka <a href="https://partner.shopee.co.id" target="_blank">partner.shopee.co.id</a> (mode samar) → F12 → tab <b>Network</b> → filter <b>report</b> → reload → klik <b>POST .../v2/shpsec/web/report</b> → tab <b>Payload</b> → copy semuanya (string panjang, bukan JSON).</p>
          </details>` : ''}
          <form id="ot-${esc(p.name)}" class="form">
            <div class="row"><label>Nomor telepon (62…)<input name="phone" placeholder="62812…" required></label></div>
            ${p.name === 'shopeepay' ? `<div class="row"><label>Password (opsional)<input name="password" type="password" placeholder="kosongkan jika tidak ada" autocomplete="off"></label>
            <label>Channel<select name="channel"><option value="">Otomatis (default WhatsApp)</option><option value="1">SMS</option><option value="2">Voice</option><option value="3">WhatsApp</option><option value="4">Email</option></select></label></div>` : ''}
            <button class="btn" type="submit">Minta OTP</button>
          </form>
          <p id="ot-msg-${esc(p.name)}" class="msg"></p>
          <form id="vf-${esc(p.name)}" class="form" style="display:none">
            <div class="row"><label>Kode OTP (dikirim via SMS${p.name === 'shopeepay' ? '/WhatsApp' : ''})<input name="otp" inputmode="numeric" placeholder="123456" required></label></div>
            <button class="btn sec" type="submit">Verifikasi</button>
          </form>
          <div id="mc-${esc(p.name)}" class="form" style="display:none">
            <p class="msg ok">Pilih merchant untuk menyelesaikan login (tanpa OTP kedua):</p>
            <div class="row" id="mc-list-${esc(p.name)}"></div>
          </div>
        </div>
        ${p.name === 'shopeepay' ? `
        <div class="panel">
          <h4>Token Manual (QRIS H+1)</h4>
          <form id="tk-${esc(p.name)}" class="form">
            <div class="row"><label>Token B:…<input name="token" placeholder="B:..." value="${esc(p.summary?.status === 'active' ? '****terpasang' : '')}" autocomplete="off"></label></div>
            <button class="btn" type="submit">Pasang Token</button>
          </form>
          <p class="hint">Cara ambil: login <b>partner.shopee.co.id</b> → DevTools (F12) → tab Network → buka halaman riwayat transaksi → cari request <b>get-transaction-list</b> → Request Payload → <b>data.metadata.token</b> → copy (dimulai dari <b>B:</b>).</p>
          <form id="st-${esc(p.name)}" class="form row" style="display:${p.summary?.status === 'active' ? '' : 'none'}">
            <select name="store_id" id="st-sel-${esc(p.name)}"></select>
            <button class="btn sec" type="submit">Pilih Store</button>
          </form>
        </div>` : ''}` : '<p class="muted">Provider ini belum diimplementasi (Phase 2).</p>'}
      </div>
    `).join('');
    rows.forEach(p => {
      const nm = p.name;
      const sq = document.getElementById('sq-'+nm); if (sq) sq.onsubmit = async e => { e.preventDefault(); const v = new FormData(e.target).get('qris_static'); const rr = await admin('/providers/'+nm+'/static-qris', { method:'PUT', body: JSON.stringify({ qris_static: v.startsWith('****')?'':v }) }); if (rr.success) toast('QRIS statis dipasang', 'ok'); else toast(rr.message||'Gagal', 'err'); render('providers'); };
      // manual health override buttons
      document.querySelectorAll(`[data-health="${nm}"]`).forEach((b) => {
        b.onclick = async () => {
          const rr = await admin('/providers/'+nm+'/health', { method:'POST', body: JSON.stringify({ state: b.dataset.state }) });
          if (rr.success) { toast(`Status ${nm} = ${b.dataset.state}`, 'ok'); render('providers'); }
          else toast(rr.message || 'Gagal', 'err');
        };
      });
      // device-risk blob handler (shopeepay only)
      const dr = document.getElementById('dr-'+nm); if (dr) {
        dr.onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target);
          const rr = await admin('/providers/'+nm+'/device-report', { method:'POST', body: JSON.stringify({ blob: fd.get('blob') }) });
          if (rr.success) { toast('Blob terpasang (' + rr.data.length + ' bytes)', 'ok'); render('providers'); }
          else toast(rr.message||'Gagal', 'err');
        };
      }
      const ot = document.getElementById('ot-'+nm); if (!ot) return;
      ot.onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target); const phone = fd.get('phone');
        const body = { phone };
        if (fd.get('password') !== null && String(fd.get('password')) !== '') body.password = fd.get('password');
        if (fd.get('channel')) body.channel = Number(fd.get('channel'));
        const rr = await admin('/providers/'+nm+'/otp', { method:'POST', body: JSON.stringify(body) });
        const msg = document.getElementById('ot-msg-'+nm);
        if (rr.success) {
          const ch = {1:'SMS',2:'Voice',3:'WhatsApp',4:'Email',5:'Zalo'}[rr.data?.channel] || 'WhatsApp';
          msg.textContent = 'Kode OTP dikirim via ' + ch + ' ke ' + (rr.data?.phone || phone) + '.';
          msg.className = 'msg ok';
          document.getElementById('vf-'+nm).style.display=''; ot.querySelector('[name=phone]').disabled = true;
        } else { msg.textContent = rr.message||'Gagal'; msg.className='msg err'; }
      };
      const vf = document.getElementById('vf-'+nm); if (!vf) return;
      vf.onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
        const rr = await admin('/providers/'+nm+'/verify', { method:'POST', body: JSON.stringify({ otp: f.otp }) });
        if (rr.success) {
          if (rr.data?.merchant_selection_required) {
            // multi-merchant: render picker (no second OTP needed)
            const list = document.getElementById('mc-list-'+nm);
            list.innerHTML = (rr.data.merchants||[]).map(m => `<button type="button" class="btn sec sm" data-mc="${esc(m.id)}">${esc(m.name||m.id)} <small>(${esc(m.id)})</small></button>`).join('');
            document.getElementById('mc-'+nm).style.display='';
            list.querySelectorAll('[data-mc]').forEach(b => b.onclick = async () => {
              const r2 = await admin('/providers/'+nm+'/complete-login', { method:'POST', body: JSON.stringify({ merchant_id: b.dataset.mc }) });
              if (r2.success) { toast('Login OK, provider aktif', 'ok'); render('providers'); } else toast(r2.message||'Gagal', 'err');
            });
          } else { toast('Login OK, provider aktif', 'ok'); render('providers'); }
        } else toast(rr.message||'Gagal', 'err');
      };
      // ShopeePay B1: paste manual token + store picker
      const tk = document.getElementById('tk-'+nm); if (!tk) return;
      tk.onsubmit = async e => { e.preventDefault(); const v = new FormData(e.target).get('token'); if (!v || v.startsWith('****')) { toast('Isi token dulu', 'err'); return; } const rr = await admin('/providers/'+nm+'/token', { method:'POST', body: JSON.stringify({ token: v }) }); if (rr.success) { toast('Token dipasang, ' + (rr.data?.stores?.length||0) + ' store ditemukan', 'ok'); render('providers'); } else toast(rr.message||'Gagal', 'err'); };
      const st = document.getElementById('st-'+nm); if (!st) return;
      (async () => {
        try {
          const rr = await admin('/providers/'+nm+'/stores');
          const sel = document.getElementById('st-sel-'+nm);
          if (rr.success && sel) {
            const cur = rr.data?.current_store_id || null;
            sel.innerHTML = (rr.data?.stores||[]).map(s => `<option value="${esc(s.id)}" ${String(s.id)===String(cur||'')?'selected':''}>${esc(s.name || s.id)} (id ${esc(s.id)})</option>`).join('');
          }
        } catch {}
      })();
      st.onsubmit = async e => { e.preventDefault(); const v = new FormData(e.target).get('store_id'); const rr = await admin('/providers/'+nm+'/store', { method:'POST', body: JSON.stringify({ store_id: v }) }); if (rr.success) { toast('Store dipilih', 'ok'); render('providers'); } else toast(rr.message||'Gagal', 'err'); };
    });
  })();
}

function renderOrders() {
  (async () => {
    const r = await admin('/orders');
    content.innerHTML = `<div class="panel"><h3>Order Langganan</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Paket</th><th>Nominal</th><th>Status</th><th></th></tr></thead><tbody>${(r.data||[]).map(o=>`<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.user_email||'-')}</td><td>${esc(o.plan_name)}</td><td>${money(o.amount)}</td><td>${tag(o.status)}</td><td>${o.status==='PENDING'?`<button class="btn sec sm" data-set="${esc(o.id)}">Settle</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
    document.querySelectorAll('[data-set]').forEach(b => b.onclick = async () => { const rr = await admin('/orders/'+b.dataset.set+'/settle', { method:'POST' }); if (rr.success) { toast('Order di-settle', 'ok'); render('orders'); } else toast(rr.message||'Gagal', 'err'); });
  })();
}

function renderQris() {
  (async () => {
    const r = await admin('/qris');
    content.innerHTML = `<div class="panel"><h3>Semua Invoice</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Provider</th><th>Base</th><th>Unik</th><th>Total</th><th>Kind</th><th>Status</th><th>Waktu</th><th></th></tr></thead><tbody>${(r.data||[]).map(i=>`<tr><td class="mono">${esc(i.id)}</td><td>${esc(i.email)}</td><td>${esc(i.provider)}</td><td>${money(i.base_amount)}</td><td>${i.unique_code}</td><td>${money(i.total_amount)}</td><td>${esc(i.kind)}</td><td>${tag(i.status)}</td><td class="muted">${new Date(i.created_at+'Z').toLocaleString('id-ID')}</td><td>${i.status==='PENDING'?`<button class="btn sec sm" data-mp="${esc(i.id)}">Mark Paid</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
    document.querySelectorAll('[data-mp]').forEach(b => b.onclick = async () => { const rr = await admin('/qris/'+b.dataset.mp+'/mark-paid', { method:'POST' }); if (rr.success) { toast('Ditandai lunas', 'ok'); render('qris'); } else toast(rr.message||'Gagal', 'err'); });
  })();
}

function renderWithdrawals() {
  (async () => {
    const r = await admin('/withdrawals');
    content.innerHTML = `<div class="panel"><h3>Antrian Withdraw</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Nominal</th><th>Bank</th><th>Status</th><th>Waktu</th><th></th></tr></thead><tbody>${(r.data||[]).map(w=>`<tr><td class="mono">${esc(w.id)}</td><td>${esc(w.user_email)}</td><td>${money(w.amount)}</td><td>${esc(w.bank_detail?.bank_name)} ${esc(w.bank_detail?.account_number)}<br><span class="muted">${esc(w.bank_detail?.account_name)}</span></td><td>${tag(w.status)}</td><td class="muted">${new Date(w.created_at+'Z').toLocaleString('id-ID')}</td><td>${w.status==='requested'?`<button class="btn sec sm" data-proc="${esc(w.id)}">Proses</button> <button class="btn danger sm" data-rej="${esc(w.id)}">Tolak</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
    document.querySelectorAll('[data-proc]').forEach(b => b.onclick = async () => { const rr = await admin('/withdrawals/'+b.dataset.proc+'/process', { method:'POST' }); if (rr.success) { toast('Withdraw diproses', 'ok'); } else toast(rr.message||'Gagal', 'err'); render('withdrawals'); });
    document.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => { const reason = prompt('Alasan tolak?'); const rr = await admin('/withdrawals/'+b.dataset.rej+'/reject', { method:'POST', body: JSON.stringify({ reason }) }); if (rr.success) toast('Withdraw ditolak', 'ok'); else toast(rr.message||'Gagal', 'err'); render('withdrawals'); });
  })();
}

function renderUnmatched() {
  (async () => {
    const r = await admin('/unmatched');
    content.innerHTML = `<div class="panel"><h3>Pembayaran Tidak Ter-cook</h3><p class="hint">Pembayaran masuk yang tidak ada invoice cocok (lewat grace window). Resolve manual ke invoice yang dimaksud, atau biarkan untuk rekonsiliasi.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Provider</th><th>Amount</th><th>TxID</th><th>Waktu</th><th></th></tr></thead><tbody>${(r.data||[]).map(u=>`<tr><td>${u.id}</td><td>${esc(u.provider)}</td><td>${money(u.amount_idr)}</td><td class="mono">${esc(u.tx_id)}</td><td class="muted">${new Date(u.found_at+'Z').toLocaleString('id-ID')}</td><td><button class="btn sec sm" data-res="${u.id}">Resolve</button></td></tr>`).join('')}</tbody></table></div></div>`;
    document.querySelectorAll('[data-res]').forEach(b => b.onclick = async () => { const qid = prompt('qris_id invoice yang dituju (kosongkan = buang):'); await admin('/unmatched/'+b.dataset.res+'/resolve', { method:'POST', body: JSON.stringify({ qris_id: qid || null }) }); toast('Unmatched di-resolve', 'ok'); render('unmatched'); });
  })();
}

function renderHolds() {
  (async () => {
    const r = await admin('/holds');
    const rows = r.data || [];
    const total = rows.reduce((s, h) => s + Number(h.amount || 0), 0);
    content.innerHTML = `<div class="panel"><h3>Hold Penyelesaian H+1</h3><p class="hint">Saldo dari pembayaran QRIS (H+1) yang masih ditahan. Dirilis otomatis tiap hari jam <b>17:00 WIB</b> (semua hold, tanpa syarat umur). Tombol di bawah untuk rilis manual per invoice, atau lepas semuanya sekarang untuk keadaan darurat.</p>
      <div class="grid" style="margin-bottom:12px"><div class="card"><div class="lbl">Total Hold</div><div class="val">${money(total)}</div></div><div class="card"><div class="lbl">Jumlah Invoice</div><div class="val">${rows.length}</div></div><div class="card"><button class="btn sec" id="release-all" ${rows.length ? '' : 'disabled'}>Lepas Semua Sekarang</button></div></div>
      <div class="table-wrap"><table><thead><tr><th>Invoice</th><th>User</th><th>Nominal</th><th>Dibuat</th><th></th></tr></thead><tbody>${rows.length ? rows.map(h => `<tr><td class="mono">${esc(h.invoice_id)}</td><td>${esc(h.email)}</td><td>${money(h.amount)}</td><td class="muted">${new Date(String(h.created_at).replace(' ', 'T') + 'Z').toLocaleString('id-ID')}</td><td><button class="btn sec sm" data-rel="${esc(h.invoice_id)}">Rilis sekarang</button></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Tidak ada hold aktif</td></tr>'}</tbody></table></div></div>`;
    document.querySelectorAll('[data-rel]').forEach(b => b.onclick = async () => {
      const rr = await admin('/holds/' + b.dataset.rel + '/release', { method: 'POST' });
      if (rr.success) { toast(rr.data?.message || 'Hold dirilis', 'ok'); render('holds'); }
      else toast(rr.message || 'Gagal melepas hold', 'err');
    });
    const ra = document.getElementById('release-all');
    if (ra) ra.onclick = async () => {
      if (!confirm('Lepas SEMUA hold sekarang? Ini mengabaikan umur H+1 — pembayaran baru juga akan cair.')) return;
      const rr = await admin('/holds/release-all', { method: 'POST' });
      if (rr.success) { toast(`${rr.data.released_count} hold dilepas (Rp ${rr.data.total_amount})`, 'ok'); render('holds'); }
      else toast(rr.message || 'Gagal', 'err');
    };
  })();
}

function renderLogs() {
  (async () => {
    const r = await admin('/logs');
    content.innerHTML = `<div class="panel"><h3>Log Aktivitas</h3><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Level</th><th>User</th><th>Pesan</th></tr></thead><tbody>${(r.data||[]).map(l=>`<tr><td class="muted">${new Date(l.created_at+'Z').toLocaleString('id-ID')}</td><td>${tag(l.level)}</td><td>${esc(l.user_email||l.user_id||'-')}</td><td>${esc(l.message)}</td></tr>`).join('')}</tbody></table></div></div>`;
  })();
}

const initial = location.hash.slice(1) || 'overview';
render(initial);
</script>
