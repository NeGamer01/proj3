<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<title>QRISPay — Dashboard</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/app.css?v=17">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="/assets/logo.svg" alt="QRISPay">
      <div><h1>QRISPay</h1><p class="brand-sub">Payment Gateway</p></div>
    </div>
    <nav>
      <div class="nav-group-label">Menu</div>
      <a href="#overview" class="nav" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
      <a href="#balance" class="nav" data-view="balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>Saldo & Withdraw</a>
      <a href="#qris" class="nav" data-view="qris"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M14 3h3a1 1 0 0 1 1 1v3M3 14v-3a1 1 0 0 1 1-1h3"/></svg>Invoice QRIS</a>
      <a href="#keys" class="nav" data-view="keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M17 4l3 3M14 7l3 3"/></svg>API Keys</a>
      <a href="#subscription" class="nav" data-view="subscription"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h6"/></svg>Langganan</a>
      <a href="#webhooks" class="nav" data-view="webhooks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.5-1.5A4.5 4.5 0 0 1 17 15.5"/><path d="M12 12v9M9 21h6"/></svg>Webhooks</a>
      <div class="nav-group-label">Bantuan</div>
      <a href="/docs" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h7M8 12h7"/></svg>Docs</a>
      <a href="#" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>Keluar</a>
    </nav>
  </aside>
  <main class="main">
    <div class="main-inner">
      <div class="topbar">
        <img class="topbar-logo" src="/assets/logo.svg" alt="">
        <h2 id="view-title">Overview</h2>
        <div class="user" id="whoami"></div>
      </div>
      <div id="content"></div>
    </div>
  </main>
</div>
<script src="/assets/common.js?v=17"></script>
<script>
// Global error trap: tampilkan error JS langsung di layar supaya bisa dilihat user
window.addEventListener('error', (e) => {
  const c = document.getElementById('content');
  if (c) c.innerHTML = `<div class="panel"><h3>Terjadi Error</h3><p class="msg err">${esc(e.message)}</p><p class="hint">File: ${esc(e.filename)}:${e.lineno}:${e.colno}</p><button class="btn sec" onclick="location.reload()">Muat ulang</button></div>`;
});
const content = document.getElementById('content');
const title = document.getElementById('view-title');
const TITLES = { overview: 'Overview', balance: 'Saldo & Withdraw', qris: 'Invoice QRIS', keys: 'API Keys', subscription: 'Langganan', webhooks: 'Webhooks' };

document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await api('/app/api/auth/logout', { method: 'POST' }); location.href = '/'; };
document.querySelectorAll('.nav').forEach(a => a.onclick = (e) => { e.preventDefault(); const v = a.dataset.view; location.hash = v; render(v); });

function renderError(msg) {
  content.innerHTML = `<div class="panel"><h3>Gagal memuat</h3><p class="msg err">${esc(msg || 'Terjadi kesalahan')}</p><button class="btn sec" onclick="location.reload()">Muat ulang</button></div>`;
}

async function render(view) {
  title.textContent = TITLES[view] || view;
  setActiveNav(view);
  showSkeleton(content);
  let ov;
  try {
    ov = await loadOverview();
  } catch (e) {
    renderError(e.message);
    return;
  }
  if (!ov) return; // bounced to /login
  document.getElementById('whoami').innerHTML = `<span class="dot"></span> ${esc(ov.user.email)}`;
  content.innerHTML = `<p class="muted">Memuat ${TITLES[view] || view}…</p>`;
  if (view === 'overview') return renderOverview(ov);
  if (view === 'balance') return renderBalance(ov);
  if (view === 'qris') return renderQris(ov);
  if (view === 'keys') return renderKeys(ov);
  if (view === 'subscription') return renderSubscription(ov);
  if (view === 'webhooks') return renderWebhooks(ov);
}

function renderOverview(d) {
  const provs = d.providers.map(p => `<div class="card"><div class="lbl">${esc(p.label)}</div><div class="val" style="font-size:14px">${p.implemented ? 'Aktif' : 'Segera'}</div><div class="sub">${esc(p.summary?.status || '')}</div></div>`).join('');
  content.innerHTML = `
    <div class="grid">
      <div class="card accent"><div class="lbl">Saldo Tersedia</div><div class="val">${money(d.balance.available)}</div><div class="sub">Held: ${money(d.balance.held)}</div></div>
      <div class="card"><div class="lbl">Paket</div><div class="val" style="font-size:14px">${esc(d.subscription.plan || 'Gratis (H+1)')}</div><div class="sub">${d.subscription.active ? 'Aktif' : 'Tidak aktif'}</div></div>
      <div class="card"><div class="lbl">Invoice Lunas (30d)</div><div class="val">${d.stats.paid}</div><div class="sub">Volume ${money(d.stats.paid_volume)}</div></div>
      <div class="card"><div class="lbl">API Keys</div><div class="val">${d.api_keys.length}<small> / 5</small></div><div class="sub">Maksimal 5 key</div></div>
    </div>
    <div class="panel">
      <h3>Metode Pembayaran</h3>
      <div class="chan-toggle">
        <div class="seg" id="chanSeg">
          <span class="thumb"></span>
          <button type="button" data-speed="qris" aria-pressed="${d.provider_choice !== 'gopay'}">QRIS<small>H+1</small></button>
          <button type="button" data-speed="realtime" aria-pressed="${d.provider_choice === 'gopay'}" ${d.can_use_realtime ? '' : 'disabled'} title="QRIS Realtime butuh paket prioritas">QRIS Realtime<small>H+0</small><span class="lock-hint">🔒 Prioritas</span></button>
        </div>
        <div>
          <div class="chan-side">${d.provider_choice === 'gopay' ? 'H+0 · langsung' : 'H+1 · settlement besok'}</div>
          ${d.can_use_realtime ? '' : `<div class="lock-cta"><span class="tag warn">Prioritas</span> <a href="#subscription" data-goto-sub>Buka paket</a> untuk QRIS Realtime</div>`}
        </div>
      </div>
      <p class="hint" style="margin-top:12px">Metode <b>QRIS</b> tersedia untuk semua user. Metode <b>QRIS Realtime</b> (H+0) hanya untuk paket Prioritas.</p>
     </div>
    <div class="panel"><h3>Status Metode</h3><div class="grid">${provs}</div></div>
    <div class="panel"><h3>Metode Tersedia</h3><p class="hint">Paket Anda: <b>${d.can_use_realtime ? 'QRIS + QRIS Realtime' : 'QRIS (H+1)'}</b></p></div>
  `;
  const seg = document.getElementById('chanSeg');
  if (seg) {
    const setBusy = (on) => { seg.querySelectorAll('button').forEach(b => b.disabled = on); };
    seg.querySelectorAll('button[data-speed]').forEach((btn) => {
      const origDisabled = btn.disabled;
      btn.addEventListener('click', async () => {
        const next = btn.dataset.speed; // "qris" | "realtime" — a speed, not a provider
        const isRt = next === 'realtime';
        if (seg.classList.contains('rt') === isRt) return; // sudah di posisi ini
        setBusy(true);
        const r = await api('/app/api/prefs', { method: 'PUT', body: JSON.stringify({ provider_choice: isRt ? 'gopay' : 'shopeepay' }) });
        setBusy(false);
        if (r.success) { toast(`Metode: ${isRt ? 'QRIS Realtime' : 'QRIS'}`, 'ok'); render('overview'); }
        else { toast(r.message || 'Gagal mengubah metode', 'err'); btn.disabled = origDisabled; }
      });
    });
  }
  const goSub = document.querySelector('[data-goto-sub]');
  if (goSub) goSub.onclick = (e) => { e.preventDefault(); location.hash = 'subscription'; render('subscription'); };
}

function renderBalance(d) {
  content.innerHTML = `
    <div class="grid">
      <div class="card"><div class="lbl">Saldo</div><div class="val">${money(d.balance.balance)}</div></div>
      <div class="card"><div class="lbl">Ditahan (Held)</div><div class="val">${money(d.balance.held)}</div></div>
      <div class="card accent"><div class="lbl">Tersedia</div><div class="val">${money(d.balance.available)}</div></div>
    </div>
    <div class="panel">
      <h3>Ajukan Withdraw</h3>
      <form id="wd" class="form">
        <div class="row">
          <label>Nominal<input name="amount" type="number" min="1000" required></label>
          <label>Bank<input name="bank_name" placeholder="BCA / Mandiri / dll" required></label>
        </div>
        <div class="row">
          <label>No. Rekening<input name="account_number" required></label>
          <label>Atas Nama<input name="account_name" required></label>
        </div>
        <button class="btn" type="submit">Ajukan</button>
      </form>
      <p id="wd-msg" class="msg"></p>
    </div>
    <div class="panel"><h3>Riwayat Withdraw</h3><div id="wd-list"></div></div>
    <div class="panel"><h3>Ledger (Audit Trail)</h3><div id="ldg-list"></div></div>
  `;
  document.getElementById('wd').addEventListener('submit', async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const msg = document.getElementById('wd-msg');
    const btn = e.target.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Memuat…';
    const r = await api('/app/api/withdraw', { method: 'POST', body: JSON.stringify({ amount: Number(f.amount), bank_detail: { method: 'bank', bank_name: f.bank_name, account_number: f.account_number, account_name: f.account_name } }) });
    btn.disabled = false; btn.textContent = 'Ajukan';
    if (r.success) { toast('Withdraw diajukan. Menunggu proses admin.', 'ok'); render('balance'); }
    else { msg.textContent = r.message || 'Gagal'; msg.className = 'msg err'; toast(r.message || 'Gagal mengajukan withdraw', 'err'); }
  });
  (async () => {
    const [wd, lg] = await Promise.all([api('/app/api/withdrawals'), api('/app/api/ledger')]);
    document.getElementById('wd-list').innerHTML = (wd.data || []).length ? `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Nominal</th><th>Status</th><th>Waktu</th><th></th></tr></thead><tbody>${(wd.data||[]).map(w => `<tr><td class="mono">${esc(w.id)}</td><td>${money(w.amount)}</td><td>${tag(w.status)}</td><td class="muted">${new Date(w.created_at).toLocaleString('id-ID')}</td>${w.status === 'requested' ? `<td><button class="btn danger sm" data-cancel="${esc(w.id)}">Batal</button></td>` : '<td></td>'}</tr>`).join('')}</tbody></table></div>` : '<p class="empty">Belum ada withdraw</p>';
    document.getElementById('ldg-list').innerHTML = `<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Tipe</th><th>Nominal</th><th>Saldo setelah</th></tr></thead><tbody>${(lg.data || []).map(e => `<tr><td class="muted">${new Date(e.created_at).toLocaleString('id-ID')}</td><td>${esc(e.type)}</td><td>${money(e.amount)}</td><td>${money(e.balance_after)}</td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => { await api('/app/api/withdrawals/' + b.dataset.cancel + '/cancel', { method: 'POST' }); toast('Withdraw dibatalkan', 'ok'); render('balance'); });
  })();
}

function renderQris(d) {
  content.innerHTML = `
    <div class="panel">
      <h3>Buat Invoice Tes</h3>
      <form id="qi" class="form">
        <div class="row">
          <label>Nominal (base)<input name="amount" type="number" min="1000" required></label>
          <label>Metode<input class="mono" value="${esc(d.provider_choice === 'gopay' ? 'QRIS Realtime' : 'QRIS')}" readonly style="cursor:default"></label>
          <label>Reference<input name="reference" placeholder="TEST"></label>
        </div>
        <button class="btn" type="submit">Buat QRIS</button>
      </form>
      <p id="qi-msg" class="msg"></p>
      <p class="hint">Metode dipilih di halaman Overview. Yang dipakai sekarang: <b>${esc(d.provider_label)}</b> ${d.provider_choice === 'gopay' ? '(H+0)' : '(H+1)'}.</p>
    </div>
    <div class="panel"><h3>Invoice Terbaru</h3><div id="qi-list"></div></div>
  `;
  document.getElementById('qi').addEventListener('submit', async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const msg = document.getElementById('qi-msg');
    const btn = e.target.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Memuat…';
    const r = await api('/app/api/qris', { method: 'POST', body: JSON.stringify({ amount: Number(f.amount), reference: f.reference }) });
    btn.disabled = false; btn.textContent = 'Buat QRIS';
    if (r.success) { toast(`QRIS dibuat: ${r.data.qris_id}`, 'ok'); window.open(`/qr/${r.data.qris_id}?amt=${r.data.amount}`, '_blank'); }
    else { msg.textContent = r.message || 'Gagal'; msg.className = 'msg err'; toast(r.message || 'Gagal membuat QRIS', 'err'); }
    loadQrisList();
  });
  async function loadQrisList() {
    const r = await api('/app/api/qris');
    document.getElementById('qi-list').innerHTML = `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Metode</th><th>Total</th><th>Status</th><th>Waktu</th></tr></thead><tbody>${(r.data || []).map(i => `<tr><td><a href="/qr/${esc(i.qris_id)}" target="_blank" class="mono">${esc(i.qris_id)}</a></td><td>${esc(i.provider === 'gopay' ? 'QRIS Realtime' : 'QRIS')}</td><td>${money(i.amount)}</td><td>${tag(i.status)}</td><td class="muted">${new Date(i.created_at).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody></table></div>`;
  }
  loadQrisList();
}

function renderKeys(d) {
  content.innerHTML = `
    <div class="panel">
      <h3>Buat API Key</h3>
      <form id="kf" class="form"><div class="row"><label>Label (opsional)<input name="label"></label><button class="btn" type="submit">Buat</button></div></form>
      <p id="kf-msg" class="msg"></p>
    </div>
    <div class="panel"><h3>API Keys</h3><div id="kf-list"></div></div>
  `;
  document.getElementById('kf').addEventListener('submit', async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const msg = document.getElementById('kf-msg');
    const r = await api('/app/api/keys', { method: 'POST', body: JSON.stringify(f) });
    if (r.success) { msg.innerHTML = `Key (simpan!): <code>${esc(r.data.key)}</code>`; msg.className = 'msg ok'; toast('API Key dibuat. Simpan baik-baik!', 'ok'); loadKeys(); }
    else { msg.textContent = r.message || 'Gagal'; msg.className = 'msg err'; toast(r.message || 'Gagal', 'err'); }
  });
  async function loadKeys() {
    const r = await api('/app/api/keys');
    document.getElementById('kf-list').innerHTML = `<div class="table-wrap"><table><thead><tr><th>Prefix</th><th>Label</th><th>Status</th><th>Dibuat</th><th></th></tr></thead><tbody>${(r.data || []).map(k => `<tr><td><code>${esc(k.key_prefix)}</code></td><td>${esc(k.label || '')}</td><td>${tag(k.active ? 'active' : 'blocked')}</td><td class="muted">${new Date(k.created_at).toLocaleString('id-ID')}</td><td><button class="btn danger sm" data-rev="${k.id}">Cabut</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { await api('/app/api/keys/' + b.dataset.rev, { method: 'DELETE' }); toast('API Key dicabut', 'ok'); loadKeys(); });
  }
  loadKeys();
}

function renderSubscription(d) {
  (async () => {
    const [plans, sub] = await Promise.all([api('/app/api/plans'), api('/app/api/subscription')]);
    content.innerHTML = `
      <div class="panel"><h3>Status Langganan</h3><p>Paket: <b>${esc(sub.data.status.plan || 'Gratis (H+1)')}</b> ${tag(sub.data.status.active ? 'active' : 'EXPIRED')}<br>Sampai: ${sub.data.status.ends_at ? new Date(sub.data.status.ends_at + 'Z').toLocaleString('id-ID') : '-'}<br>Metode: <b>${sub.data.status.providers.includes('gopay') ? 'QRIS + QRIS Realtime' : 'QRIS (H+1)'}</b></p></div>
      <div class="panel"><h3>Pilih Paket</h3><div class="table-wrap"><table><thead><tr><th>Paket</th><th>Settlement</th><th>Metode</th><th>Harga</th><th>Durasi</th><th></th></tr></thead><tbody>${(plans.data || []).map(p => {
        const isPriority = (p.providers || []).includes('gopay');
        return `<tr><td>${esc(p.name)} ${isPriority ? '<span class="badge">Prioritas</span>' : ''}</td><td>${esc(p.tier === 'H0' ? 'H+0' : 'H+1')}</td><td>${isPriority ? 'QRIS + QRIS Realtime' : 'QRIS'}</td><td>${money(p.price)}</td><td>${p.duration_days} hari</td><td>${p.price > 0 ? `<button class="btn sm" data-plan="${p.id}">Beli</button>` : '<span class="muted">Gratis</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="hint" style="margin-top:10px">Paket berbadge <b>Prioritas</b> memungkinkan metode <b>QRIS Realtime</b> (H+0) di halaman Overview.</p></div>
      <div class="panel"><h3>Riwayat</h3><div class="table-wrap"><table><thead><tr><th>Order</th><th>Paket</th><th>Nominal</th><th>Status</th></tr></thead><tbody>${(sub.data.orders || []).map(o => `<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.plan_name)}</td><td>${money(o.amount)}</td><td>${tag(o.status)}</td></tr>`).join('')}</tbody></table></div></div>
    `;
    document.querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => {
      const r = await api('/app/api/subscription/orders', { method: 'POST', body: JSON.stringify({ plan_id: Number(b.dataset.plan) }) });
      if (r.success && r.data.qris_id) { toast('Order dibuat. Scan QR untuk bayar.', 'ok'); window.open(`/qr/${r.data.qris_id}?amt=${r.data.amount}`, '_blank'); }
      else toast(r.message || 'Gagal membuat order', 'err');
    });
  })();
}

function renderWebhooks(d) {
  content.innerHTML = `
    <div class="panel">
      <h3>Daftarkan Webhook</h3>
      <form id="wh" class="form">
        <label>URL<input name="url" placeholder="https://yourbot/webhook" required></label>
        <label>Secret (opsional)<input name="secret" placeholder="HMAC secret"></label>
        <button class="btn" type="submit">Daftarkan</button>
      </form>
      <p id="wh-msg" class="msg"></p>
    </div>
    <div class="panel"><h3>Webhooks</h3><div id="wh-list"></div></div>
  `;
  document.getElementById('wh').addEventListener('submit', async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const msg = document.getElementById('wh-msg');
    const r = await api('/app/api/webhooks', { method: 'POST', body: JSON.stringify(f) });
    if (r.success) { toast('Webhook terdaftar', 'ok'); loadWh(); } else { msg.textContent = r.message || 'Gagal'; msg.className = 'msg err'; }
  });
  async function loadWh() {
    const r = await api('/app/api/webhooks');
    document.getElementById('wh-list').innerHTML = `<div class="table-wrap"><table><thead><tr><th>URL</th><th>Events</th><th></th></tr></thead><tbody>${(r.data || []).map(w => `<tr><td class="mono">${esc(w.url)}</td><td>${esc(w.events.join(', '))}</td><td><button class="btn danger sm" data-del="${esc(w.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('/app/api/webhooks/' + b.dataset.del, { method: 'DELETE' }); toast('Webhook dihapus', 'ok'); loadWh(); });
  }
  loadWh();
}

const initial = location.hash.slice(1) || 'overview';
render(initial);
</script>
